<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSR Rice Mill — From Paddy to Plate</title>
<script>try{if(localStorage.getItem("ssr-lang")==="te")document.documentElement.lang="te"}catch(e){}</script>
<meta name="description" content="Sri Sai Ramana Parboiled Modern Rice Mill, Huzur Nagar, Telangana — parboiled rice, wholesale and custom milling.">
<meta name="theme-color" content="#1f3d2b">
<link rel="icon" type="image/png" href="assets/logo/favicon.png">
<link rel="apple-touch-icon" href="assets/logo/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&family=Noto+Serif+Telugu:wght@500;600&display=swap" rel="stylesheet">
<!-- Look and flow inspired by a premium brand site: announcement bar, full-bleed hero, trust strip, story, FAQ -->
<link rel="preload" as="image" href="assets/loader/walk-poster.jpg" fetchpriority="high">
<link rel="preload" as="image" href="assets/hero-poster.jpg">
<noscript><link rel="stylesheet" href="/noscript.css"></noscript>
</head>
<body>
<div class="ldr" id="ldr" role="status" aria-label="Loading SSR Rice Mill">
 <video class="ldr-vid" id="ldrv" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny" controlslist="nodownload nofullscreen noremoteplayback" tabindex="-1" muted playsinline autoplay preload="auto" poster="assets/loader/walk-poster.jpg" aria-hidden="true">
  <source src="assets/loader/walk-540.mp4" type="video/mp4" media="(max-width: 820px)">
  <source src="assets/loader/walk-720.mp4" type="video/mp4">
 </video>
 <div class="ldr-shade"></div>
 <div class="ldr-c">
  <img class="ldr-logo" src="assets/logo/ssr-mark-light.png" width="410" height="215" alt="SSR">
  <p class="ldr-t" data-te="మా మిల్లు నుండి తాజా బియ్యం వస్తోంది&hellip;">Bringing fresh rice from our mill&hellip;</p>
  <div class="ldr-bar"><i></i></div>
 </div>
</div>
<script>
/* loading screen: real footage of a farmer carrying a sack through the fields (Pexels 4684807).
   Starts at 1.2s (skips a passer-by at the left edge) and loops from there. Stays ~2.2s so the walk is seen,
   hides when the page has loaded, never longer than 6s. */
(function(){var l=document.getElementById("ldr");if(!l)return;if(document.documentElement.lang==="te"){var lt=l.querySelector(".ldr-t");if(lt)lt.innerHTML=lt.getAttribute("data-te")}var d=document.documentElement,v=document.getElementById("ldrv"),t0=Date.now(),gone=false,START=1.2;d.classList.add("ldg");
 var still=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
 function play(){if(still||gone)return;var p=v.play();if(p&&p.catch)p.catch(function(){})}
 if(v){v.addEventListener("loadedmetadata",function(){try{v.currentTime=START}catch(e){}});
  v.addEventListener("playing",function(){v.classList.add("on")});
  v.addEventListener("ended",function(){v.currentTime=START;play()});
  if(still){v.removeAttribute("autoplay");v.preload="none"}else play()}
 function hide(){if(gone)return;gone=true;l.classList.add("done");d.classList.remove("ldg");setTimeout(function(){if(v)v.pause();if(l.parentNode)l.parentNode.removeChild(l)},900)}
 function ready(){setTimeout(hide,Math.max(0,2200-(Date.now()-t0)))}
 if(document.readyState==="complete")ready();else addEventListener("load",ready);
 setTimeout(hide,6000);
 addEventListener("pageshow",function(e){if(e.persisted)hide()})})();
</script>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
